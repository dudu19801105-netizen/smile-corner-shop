<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>合作詢問｜微笑角落</title><meta content="準備設計、書籍排版與網站製作的專案需求摘要。" name="description"/><link href="style.css?v=20261103-catalog-ai1" rel="stylesheet"/><style>.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #668198;background:#10243a;color:#fff;padding:12px;border-radius:10px;font:inherit}.field textarea{min-height:130px}.brief{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:#0b1d2d;padding:18px;border-radius:14px}@media(max-width:640px){.form-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">微笑角落 <span>SMILE CORNER</span></a><nav class="links"><a href="index.html">首頁</a><a href="books.html">書籍</a><a href="index.html#services">服務</a></nav></div></header><main class="wrap"><div class="crumb"><a href="index.html">首頁</a> / 服務需求規劃</div><section><div class="kicker">合作需求規劃</div><h1 style="font-size:clamp(2.3rem,5vw,4rem)">告訴我們你的合作需求</h1><p>書籍排版、封面設計、小型網站與品牌合作，都可以從一份清楚的需求開始。先整理摘要，再開啟郵件軟體寄出詢問。</p><div class="notice" id="contactState" role="status">正在讀取合作收件設定…</div><form class="panel" id="briefForm"><div class="form-grid"><div class="field"><label for="clientEmail">回覆信箱（選填）</label><input autocomplete="email" id="clientEmail" maxlength="150" type="email"/></div><div class="field"><label for="clientName">你的稱呼（選填）</label><input autocomplete="name" id="clientName" maxlength="150" type="text"/></div><div class="field"><label for="service">需要的服務</label><select id="service"><option>書籍內頁 / PDF 排版</option><option>封面與宣傳視覺</option><option>簡易網站 / 書籍目錄</option><option>其他創意服務</option></select></div><div class="field"><label for="format">交付格式</label><select id="format"><option>PDF</option><option>PNG / JPG</option><option>HTML / 網站</option><option>需要討論</option></select></div><div class="field"><label for="deadline">理想完成日期（選填）</label><input id="deadline" type="date"/></div><div class="field"><label for="budget">預算範圍（選填）</label><select id="budget"><option value="">尚未決定</option><option>USD 50–150</option><option>USD 150–500</option><option>USD 500+</option></select></div></div><div class="field"><label for="details">專案需求</label><textarea id="details" maxlength="1800" placeholder="例如：英文書內頁，8.5×11 吋，約 120 頁，需要清楚的大字排版。" required=""></textarea></div><div class="actions"><button class="btn primary" type="submit">產生需求摘要</button><button class="btn secondary" disabled="" id="copy" type="button">複製摘要</button><button class="btn secondary" disabled="" id="download" type="button">下載 TXT</button><button class="btn primary" disabled="" id="mail" type="button">開啟郵件軟體寄出</button></div><p aria-live="polite" id="message" role="status"></p><p class="small">此頁不儲存你的聯絡資料。開啟郵件後，請自行檢查並按寄出；這不代表已接受報價或訂單。</p></form></section><section><h2>需求摘要</h2><div class="brief" id="result">填寫上方內容後，按「產生需求摘要」。</div></section></main><footer><div class="wrap"><a href="privacy.html">隱私說明</a> · <a href="index.html">返回首頁</a></div></footer><script defer="" src="contact.js?v=20261103-1"></script></body></html>
