<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服務需求規劃 | Smile Corner</title><meta name="description" content="準備設計、書籍排版與網站製作的專案需求摘要。"><link rel="stylesheet" href="style.css"><style>.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #668198;background:#10243a;color:#fff;padding:12px;border-radius:10px;font:inherit}.field textarea{min-height:130px}.brief{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:#0b1d2d;padding:18px;border-radius:14px}@media(max-width:640px){.form-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">SMILE CORNER <span>SHOP</span></a><nav class="links"><a href="index.html">首頁</a><a href="books.html">書籍</a><a href="index.html#services">服務</a></nav></div></header><main class="wrap"><div class="crumb"><a href="index.html">首頁</a> / 服務需求規劃</div><section><div class="kicker">Project planner</div><h1 style="font-size:clamp(2.3rem,5vw,4rem)">整理你的專案需求</h1><p>適用於書籍排版、封面設計與小型網站。填完後可以複製或下載需求摘要，方便日後詢價。</p><div class="notice"><strong>重要：</strong>此頁沒有正式收件功能，按下產生不會將資料寄給 Smile Corner。資料只在目前頁面處理，請勿填入電話、地址、付款資料或機密內容。</div><form id="briefForm" class="panel"><div class="form-grid"><div class="field"><label for="service">需要的服務</label><select id="service"><option>書籍內頁 / PDF 排版</option><option>封面與宣傳視覺</option><option>簡易網站 / 書籍目錄</option><option>其他創意服務</option></select></div><div class="field"><label for="format">交付格式</label><select id="format"><option>PDF</option><option>PNG / JPG</option><option>HTML / 網站</option><option>需要討論</option></select></div><div class="field"><label for="deadline">理想完成日期（選填）</label><input id="deadline" type="date"></div><div class="field"><label for="budget">預算範圍（選填）</label><select id="budget"><option value="">尚未決定</option><option>USD 50–150</option><option>USD 150–500</option><option>USD 500+</option></select></div></div><div class="field"><label for="details">專案需求</label><textarea id="details" maxlength="3000" required placeholder="例如：英文書內頁，8.5×11 吋，約 120 頁，需要清楚的大字排版。"></textarea></div><div class="actions"><button class="btn primary" type="submit">產生需求摘要</button><button class="btn secondary" type="button" id="copy" disabled>複製摘要</button><button class="btn secondary" type="button" id="download" disabled>下載 TXT</button></div><p id="message" role="status" aria-live="polite"></p></form></section><section><h2>需求摘要</h2><div id="result" class="brief">填寫上方內容後，按「產生需求摘要」。</div></section></main><footer><div class="wrap"><a href="privacy.html">隱私說明</a> · <a href="index.html">返回首頁</a></div></footer><script>(()=>{'use strict';const $=id=>document.getElementById(id);let result='';$('briefForm').addEventListener('submit',e=>{e.preventDefault();const value=id=>$(id).value.trim();result=['Smile Corner | Project Brief','Service: '+value('service'),'Format: '+value('format'),'Preferred deadline: '+(value('deadline')||'To discuss'),'Budget: '+(value('budget')||'Not specified'),'','Project requirements:',value('details'),'','Prepared locally. NOT SENT to Smile Corner.'].join('\n');$('result').textContent=result;$('copy').disabled=false;$('download').disabled=false;$('message').textContent='摘要已產生，尚未寄送。';});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);$('message').textContent='摘要已複製。'}catch{$('message').textContent='複製失敗，請手動選取下方文字。'}};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([result],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='smile-corner-project-brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);$('message').textContent='摘要 TXT 已建立。';};})();</script></body></html>
